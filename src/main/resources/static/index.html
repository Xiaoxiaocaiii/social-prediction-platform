<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多模态社交媒体流行度预测与可视化分析平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
    <div class="brand">
        <div class="brand-title">流行度预测平台</div>
        <div class="brand-sub">SMTPD · 282,481 条真实数据</div>
    </div>
    <nav class="nav">
        <button class="nav-btn active" data-page="predict">上传预测</button>
        <button class="nav-btn" data-page="ranking">热度排行榜</button>
        <button class="nav-btn" data-page="insights">数据洞察</button>
        <button class="nav-btn" data-page="compare">曲线对比</button>
    </nav>
</header>

<main>
    <section id="page-predict" class="page active">
        <div class="page-head">
            <h1>上传预测</h1>
            <p>上传图片与文案，检索最相似的历史视频，预测未来 30 天热度曲线。</p>
        </div>
        <div class="placeholder-card">功能建设中（2.3 步骤实现）</div>
    </section>

    <section id="page-ranking" class="page">
        <div class="page-head">
            <h1>热度排行榜</h1>
            <p>浏览 282,481 条真实 YouTube 视频，支持分类筛选、排序与搜索。</p>
        </div>
        <div class="filter-bar">
            <select id="rank-category" class="input">
                <option value="">全部分类</option>
                <option>People  Blogs</option>
                <option>Gaming</option>
                <option>Entertainment</option>
                <option>News  Politics</option>
                <option>Music</option>
                <option>Education</option>
                <option>Howto  Style</option>
                <option>Sports</option>
                <option>Film  Animation</option>
                <option>Nonprofits  Activism</option>
                <option>Travel  Events</option>
                <option>Science  Technology</option>
                <option>Comedy</option>
                <option>Autos  Vehicles</option>
                <option>Pets  Animals</option>
            </select>
            <select id="rank-sort" class="input">
                <option value="day30_desc">Day30 热度</option>
                <option value="day1_desc">Day1 热度</option>
                <option value="title">标题</option>
            </select>
            <input id="rank-q" class="input search-input" type="text" placeholder="搜索标题 / 标签 / 描述">
            <button id="rank-search" class="btn primary">搜索</button>
        </div>
        <div id="rank-total" class="rank-total"></div>
        <div id="rank-grid" class="video-grid"></div>
        <div class="pager">
            <button id="rank-prev" class="btn">上一页</button>
            <span id="rank-page-info" class="pager-info"></span>
            <button id="rank-next" class="btn">下一页</button>
        </div>
    </section>

    <section id="page-insights" class="page">
        <div class="page-head">
            <h1>数据洞察</h1>
            <p>分类热度对比、早期热度与最终热度相关性、平均热度衰减曲线。</p>
        </div>
        <div class="placeholder-card">功能建设中（2.4 步骤实现）</div>
    </section>

    <section id="page-compare" class="page">
        <div class="page-head">
            <h1>曲线对比</h1>
            <p>任选 2~3 个视频，叠加比较真实热度曲线与峰值/衰减指标。</p>
        </div>
        <div class="placeholder-card">功能建设中（2.5 步骤实现）</div>
    </section>
</main>

<div id="detail-modal" class="modal hidden">
    <div class="modal-backdrop" data-close="detail-modal"></div>
    <div class="modal-panel">
        <button class="modal-close" data-close="detail-modal">×</button>
        <div id="detail-body"></div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script src="lib/echarts.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/ranking.js"></script>
</body>
</html>
