name: Desktop Edge policy

on:
  push:
  pull_request:

jobs:
  desktop-only:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check desktop-only source policy
        shell: pwsh
        run: ./scripts/check-desktop-only.ps1
      - name: Check diff whitespace
        shell: pwsh
        run: git diff --check
